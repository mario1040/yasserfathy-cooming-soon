<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="/images/yflogo.png" /> 
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <title>Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           COMING SOON - CREATIVE WHITE DESIGN
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-white: #FFFFFF;
            --color-black: #000000;
            --color-gray: #D4D5DA;
            --color-orange: #FD4E1A;
            --color-yellow: #FEB52C;
            --color-light-bg: #FAFBFC;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #FFFFFF 0%, #FAFBFC 100%);
            color: var(--color-black);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Particles JS Container */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: transparent;
            background-image: url('');
            background-size: cover;
            background-position: 50% 50%;
            background-repeat: no-repeat;
            z-index: 2; /* فوق الخلفية وتحت المحتوى */
        }

        /* ============================================
           MOUSE TRAIL EFFECT
           ============================================ */
        .mouse-trail {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: trailFade 0.6s linear forwards;
            box-shadow: 0 0 10px rgba(253, 78, 26, 0.2);
        }

        @keyframes trailFade {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        /* ============================================
           BACKGROUND ELEMENTS
           ============================================ */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        /* Blobs & Gradients */
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 1;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            top: -20%;
            right: -10%;
            background: linear-gradient(135deg, var(--color-orange) 0%, var(--color-yellow) 100%);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: float 15s ease-in-out infinite;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            bottom: -15%;
            left: -5%;
            background: linear-gradient(135deg, var(--color-yellow) 0%, var(--color-orange) 100%);
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: float 18s ease-in-out infinite 2s;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 5%;
            background: linear-gradient(135deg, rgba(253, 78, 26, 0.8), rgba(254, 181, 44, 0.6));
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: float 20s ease-in-out infinite 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            33% { transform: translateY(-40px) translateX(20px); }
            66% { transform: translateY(40px) translateX(-30px); }
        }

        .gradient-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-orange), transparent);
            opacity: 0.3;
            z-index: 1;
        }

        .line-1 { width: 600px; top: 20%; right: 10%; animation: slideRight 10s ease-in-out infinite; }
        .line-2 { width: 500px; bottom: 30%; left: 15%; animation: slideLeft 12s ease-in-out infinite; }

        @keyframes slideRight {
            0%, 100% { transform: translateX(-100px); opacity: 0.2; }
            50% { transform: translateX(100px); opacity: 0.5; }
        }

        @keyframes slideLeft {
            0%, 100% { transform: translateX(100px); opacity: 0.2; }
            50% { transform: translateX(-100px); opacity: 0.5; }
        }

        .aura {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(253, 78, 26, 0.15) 0%, rgba(254, 181, 44, 0.1) 30%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            top: var(--mouse-y);
            left: var(--mouse-x);
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3; /* Above particles */
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        /* ============================================
           MAIN CONTENT
           ============================================ */
        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            animation: fadeInUp 1s ease 0.3s both;
        }

        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            line-height: 1.15;
            color: var(--color-black);
            letter-spacing: -0.02em;
        }

        .hero-title span {
            display: inline-block;
            opacity: 0;
            animation: revealChar 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .hero-title span:nth-child(1) { animation-delay: 0.1s; }
        .hero-title span:nth-child(2) { animation-delay: 0.3s; }
        .hero-title span:nth-child(3) { animation-delay: 0.5s; }
        .hero-title span:nth-child(4) { animation-delay: 0.7s; }
        .hero-title span:nth-child(5) { animation-delay: 0.9s; }

        @keyframes revealChar {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--color-black);
            line-height: 1.8;
            opacity: 0;
            animation: fadeInUp 1s ease 0.8s both;
            max-width: 500px;
            font-weight: 300;
        }

        .accent-bar {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--color-orange), var(--color-yellow));
            border-radius: 2px;
            opacity: 0;
            animation: slideInRight 0.8s ease 0.5s both;
            margin-bottom: 0.5rem;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .interactive-section {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            align-items: center;
            justify-content: center;
            animation: fadeInUp 1s ease 0.6s both;
        }

        /* GIF Styles */
        .gif-wrapper {
            position: relative;
            animation: floatGif 6s ease-in-out infinite;
            perspective: 1000px;
        }

        .gif-container {
            position: relative;
            display: inline-flex;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--color-gray);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            transform-style: preserve-3d;
        }

        .gif-container img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
        }

        @keyframes floatGif {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Form Styles */
        .email-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeInUp 1s ease 1s both;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 0.75rem;
        }

        .email-input {
            flex: 1;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--color-gray);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .email-input:focus {
            outline: none;
            border-color: var(--color-orange);
            background: var(--color-white);
        }

        .submit-button {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--color-orange) 0%, #ff6b35 100%);
            border: none;
            border-radius: 12px;
            color: var(--color-white);
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(253, 78, 26, 0.25);
        }

        .form-message {
            font-size: 0.9rem;
            min-height: 20px;
            margin-top: 0.5rem;
        }

        .form-message.success { color: #059669; }
        .form-message.error { color: #dc2626; }

        /* Social Icons */
        .social-icons {
            display: flex;
            gap: 1rem;
            animation: fadeInUp 1s ease 1.2s both;
        }

        .social-link {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(253, 78, 26, 0.1);
            border: 1.5px solid var(--color-orange);
            border-radius: 12px;
            color: var(--color-orange);
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-link:hover {
            background: rgba(253, 78, 26, 0.2);
            transform: translateY(-4px);
        }

        .social-link svg {
            width: 22px;
            height: 22px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; gap: 3rem; }
            .interactive-section { max-width: 100%; }
        }
        @media (max-width: 768px) {
            .input-wrapper { flex-direction: column; }
            .submit-button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="background-container">
        <div id="particles-js"></div>
        
        <div class="aura" id="aura"></div>
        <div class="grain-overlay"></div>
        
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="gradient-line line-1"></div>
        <div class="gradient-line line-2"></div>
    </div>

    <div class="wrapper">
        <div class="container">
            <div class="hero-content">
                <div class="accent-bar"></div>
                <h1 class="hero-title">
                    <span>Something</span>
                    <span>Amazing</span>
                    <span>is</span>
                    <span>Coming</span>
                    <span>Soon</span>
                </h1>
                <p class="hero-subtitle">
                    We're serving authentic grilled kofta and premium BBQ, crafted fresh over charcoal for an unforgettable taste.
                </p>
            </div>

            <div class="interactive-section">
                <div class="gif-wrapper">
                    <div class="gif-container" id="gifContainer">
                        <img src="images/Frame 1411.png" alt="Mindthera Preview" loading="lazy">
                    </div>
                </div>

                <form class="email-form" id="emailForm" novalidate>
                    <div class="form-group">
                        <label class="form-label">Early Access</label>
                        <div class="input-wrapper">
                            <input type="email" id="emailInput" class="email-input" placeholder="your@email.com" required>
                            <button type="submit" class="submit-button">Notify</button>
                        </div>
                        <div class="form-message" id="formMessage"></div>
                    </div>
                </form>

                <div class="social-icons">
                    <a href="#" class="social-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a6 6 0 0 0-6 6v3H7v4h3v8h4v-8h3l1-4h-4V8a2 2 0 0 1 2-2h3z"></path></svg></a>
                    <a href="#" class="social-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2s9 5 20 5a9.5 9.5 0 0 0-9-5.5c4.75 2.25 7-7 7-7"></path></svg></a>
                    <a href="#" class="social-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><circle cx="17.5" cy="6.5" r="1.5"></circle></svg></a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
// 2. تفعيل الجزيئات (إعدادات جديدة أوضح)
        document.addEventListener('DOMContentLoaded', () => {
            particlesJS("particles-js", {
                "particles": {
                    "number": {
                        "value": 60, // قللت العدد سنة عشان لما تكبر متبقاش زحمة
                        "density": { "enable": true, "value_area": 800 }
                    },
                    "color": { "value": "#2c3e50" }, // لون غامق وواضح جداً (بدل الفاتح)
                    "shape": {
                        "type": "circle",
                        "stroke": { "width": 0, "color": "#000000" }
                    },
                    "opacity": {
                        "value": 0.8, // زودت الشفافية عشان تبقى ظاهرة قوي
                        "random": false,
                        "anim": { "enable": false }
                    },
                    "size": {
                        "value": 6, // كبرت الحجم (كان 3)
                        "random": true, // أحجام مختلفة عشان يبقى شكلها حلو
                        "anim": { "enable": false }
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 150,
                        "color": "#2c3e50", // الخطوط بقت نفس اللون الغامق
                        "opacity": 0.6, // تقلت الخطوط
                        "width": 1.5 // عرضت الخطوط شوية
                    },
                    "move": {
                        "enable": true,
                        "speed": 4, // سرعت الحركة سنة بسيطة
                        "direction": "none",
                        "random": false,
                        "straight": false,
                        "out_mode": "out",
                        "bounce": false,
                        "attract": { "enable": false, "rotateX": 600, "rotateY": 1200 }
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": { "enable": true, "mode": "grab" },
                        "onclick": { "enable": true, "mode": "push" },
                        "resize": true
                    },
                    "modes": {
                        "grab": { "distance": 180, "line_linked": { "opacity": 1 } },
                        "bubble": { "distance": 400, "size": 40, "duration": 2, "opacity": 8, "speed": 3 },
                        "repulse": { "distance": 200, "duration": 0.4 },
                        "push": { "particles_nb": 4 },
                        "remove": { "particles_nb": 2 }
                    }
                },
                "retina_detect": true
            });
        });
        // 3. بقية السكربتات الخاصة بالموقع (الماوس، الفورم، إلخ)
        
        // Mouse Trail
        document.addEventListener('mousemove', function(e) {
            const circle = document.createElement('div');
            circle.classList.add('mouse-trail');
            const size = Math.random() * 15 + 10;
            circle.style.width = `${size}px`;
            circle.style.height = `${size}px`;
            circle.style.left = `${e.clientX}px`;
            circle.style.top = `${e.clientY}px`;
            const colors = ['#FD4E1A', '#FEB52C', '#D4D5DA', 'rgba(253, 78, 26, 0.5)'];
            circle.style.background = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(circle);
            setTimeout(() => { circle.remove(); }, 600);
        });

        // Mouse Aura
        const aura = document.getElementById('aura');
        if (aura) {
            document.addEventListener('mousemove', (e) => {
                document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
                document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
            });
        }

        // Text Scramble
        const heroTitle = document.querySelector('.hero-title');
        if (heroTitle) {
            const titleSpans = heroTitle.querySelectorAll('span');
            const scrambleChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*';
            titleSpans.forEach((span, index) => {
                const originalText = span.textContent;
                let scrambleCount = 0;
                const maxScrambles = 12;
                const delay = index * 0.1;
                const startScramble = () => {
                    const interval = setInterval(() => {
                        if (scrambleCount < maxScrambles) {
                            span.textContent = scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
                            scrambleCount++;
                        } else {
                            span.textContent = originalText;
                            clearInterval(interval);
                        }
                    }, 30);
                };
                setTimeout(startScramble, (0.3 + delay) * 1000);
            });
        }

        // Email Form Logic
        class EmailHandler {
            constructor(form) {
                this.form = form;
                this.input = form.querySelector('#emailInput');
                this.message = form.querySelector('#formMessage');
                this.button = form.querySelector('.submit-button');
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
            }
            validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
            async handleSubmit(e) {
                e.preventDefault();
                const email = this.input.value.trim();
                if (!email || !this.validateEmail(email)) {
                    this.showMessage('Please enter a valid email', 'error');
                    return;
                }
                this.button.disabled = true;
                this.button.textContent = 'Sending...';
                try {
                    await new Promise(resolve => setTimeout(resolve, 800));
                    this.showMessage('✓ Thanks! Check your email for early access details.', 'success');
                    this.input.value = '';
                } catch (err) {
                    this.showMessage('Something went wrong. Please try again.', 'error');
                } finally {
                    this.button.disabled = false;
                    this.button.textContent = 'Notify';
                }
            }
            showMessage(text, type) {
                this.message.textContent = text;
                this.message.className = `form-message ${type}`;
            }
        }
        const form = document.getElementById('emailForm');
        if (form) new EmailHandler(form);

        // 3D Tilt Effect
        const gifWrapper = document.querySelector('.gif-wrapper');
        if (gifWrapper) {
            const gifContainer = gifWrapper.querySelector('.gif-container');
            document.addEventListener('mousemove', (e) => {
                const rect = gifWrapper.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const distX = (e.clientX - centerX);
                const distY = (e.clientY - centerY);
                const distance = Math.sqrt(distX * distX + distY * distY);
                const maxDistance = 200;
                
                if (distance < maxDistance) {
                    const tiltX = (distY / maxDistance) * 8;
                    const tiltY = (distX / maxDistance) * -8;
                    const moveX = (e.clientX - centerX) * 0.05;
                    const moveY = (e.clientY - centerY) * 0.05;
                    gifContainer.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.02)`;
                    gifWrapper.style.transform = `translate(${moveX}px, ${moveY}px)`;
                } else {
                    gifContainer.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
                    gifWrapper.style.transform = `translate(0px, 0px)`;
                }
            });
        }
    </script>
</body>
</html>
